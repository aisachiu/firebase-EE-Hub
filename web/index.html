      function paintLiveForm(form, refreshing) {
        const values = form.response ? form.response.values : {};
        const open = form.formOpen !== false;
        openFormShell(form.title, form.html, form.js, {
          fields: form.fields,
          values: values,
          student: form.student,
          readOnly: !open,
          notice: open ? '' : (form.closedMessage || 'This form is closed. Answers can no longer be changed.'),
          onSubmit: open ? function(collected, submit) {
            const panel = document.querySelector('#form-dialog .form-panel');
            markSync(panel, 'pending');
            const draft = document.getElementById('save-form-draft');
            const submitButton = document.getElementById('submit-form');
            if (draft) draft.disabled = true;
            if (submitButton) submitButton.disabled = true;
            return runMutation('saveStudentForm', [form.milestoneId, {
              values: collected,
              lastUpdated: form.response ? form.response.lastUpdated : '',
              submit: submit
            }], { key: 'form:' + form.milestoneId }).then(function(result) {
              const saved = Object.assign({}, form, {
                response: {
                  values: collected,
                  status: result && result.status ? result.status : (submit ? 'Submitted' : 'Draft'),
                  lastUpdated: result && result.lastUpdated ? result.lastUpdated : '',
                  version: form.version
                }
              });
              state.formViews[form.milestoneId] = saved;
              if (submit && form.submitCompletes !== false && state.studentHome) {
                (state.studentHome.actionItems || []).forEach(function(item) {
                  if (item.CreatorType === 'System' && item.TemplateId === form.milestoneId) item.Status = 'Completed';
                });
              }
              markSync(document.querySelector('#form-dialog .form-panel'), 'confirmed');
              window.setTimeout(function() {
                closeForm();
                showSuccess(submit ? 'Form submitted.' : 'Draft saved.');
                if (state.studentHome && document.getElementById('my-activity')) repaintStudentPage(state.studentHome);
                if (document.getElementById('journey-body')) paintStudentJourney(state.studentHome);
              }, 350);
            }).catch(function(error) {
              if (draft) draft.disabled = false;
              if (submitButton) submitButton.disabled = false;
              markSync(document.querySelector('#form-dialog .form-panel'), 'rejected');
              throw error;
            });
          } : null
        });
        if (refreshing) markSync(document.querySelector('#form-dialog .form-panel'), 'pending');
      }

      function openFormShell(title, html, js, binding) {
        const dialog = document.getElementById('form-dialog');
        const readOnly = !!(binding && binding.readOnly);
        const notice = binding && binding.notice ? `<p class="notice">${escapeHtml(binding.notice)}</p>` : '';
        dialog.hidden = false;
        dialog.innerHTML = `<div class="form-panel" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="toolbar"><h2>${escapeHtml(title)}</h2><button type="button" class="button secondary" id="close-form">Close</button></div>${notice}<div id="ee-form-root">${html || ''}</div><p class="notice error" id="form-error" hidden></p><div class="toolbar"><button type="button" class="button secondary" id="save-form-draft">Save draft</button><button type="button" class="button" id="submit-form">Submit</button></div></div>`;
        document.getElementById('close-form').addEventListener('click', closeForm);
        const root = document.getElementById('ee-form-root');
        if (binding && binding.fields) fillFormControls(root, binding.fields, binding.values || {});
        if (js) {
          try { runFormScript(js, { root: root, fields: binding ? binding.fields : [], student: binding ? binding.student : {}, draft: binding ? binding.values : {} }); }
          catch (error) {
            const formError = document.getElementById('form-error');
            formError.hidden = false;
            formError.textContent = error.message || String(error);
          }
        }
        if (readOnly) lockFormControls(root);
        const submit = function(isSubmit) {
          if (!binding || !binding.onSubmit) { closeForm(); return; }
          const error = document.getElementById('form-error');
          error.hidden = true;
          binding.onSubmit(collectFormValues(root, binding.fields), isSubmit).catch(function(err) {
            error.hidden = false;
            error.textContent = err.message || String(err);
          });
        };
        if (!binding || !binding.onSubmit) {
          document.getElementById('save-form-draft').hidden = true;
          document.getElementById('submit-form').hidden = true;
        } else {
          document.getElementById('save-form-draft').addEventListener('click', function() { submit(false); });
          document.getElementById('submit-form').addEventListener('click', function() { submit(true); });
        }
      }

      function lockFormControls(root) {
        root.querySelectorAll('input, textarea, select').forEach(function(control) {
          control.disabled = true;
        });
      }

      function closeForm() {
        const dialog = document.getElementById('form-dialog');
        if (!dialog) return;
        dialog.hidden = true;
        dialog.innerHTML = '';
      }

      function namedControls(root, name) {
        return Array.prototype.filter.call(root.querySelectorAll('[name]'), function(control) { return control.name === name; });
      }

      function fillCheckGroup(root, field, current) {
        const selected = String(current || '').split(';').map(function(part) { return part.trim(); }).filter(Boolean);
        let host = root.querySelector('[data-checks="' + field.name + '"]');
        if (!host) {
          host = document.createElement('div');
          host.className = 'check-grid';
          host.setAttribute('data-checks', field.name);
          const label = document.createElement('label');
          label.className = 'field wide';
          label.appendChild(document.createTextNode(field.label));
          label.appendChild(host);
          root.appendChild(label);
        }
        host.innerHTML = (field.options || []).map(function(option) {
          const checked = selected.indexOf(option) >= 0 ? ' checked' : '';
          return `<label class="check-option"><input type="checkbox" name="${escapeHtml(field.name)}" value="${escapeHtml(option)}"${checked}> ${escapeHtml(option)}</label>`;
        }).join('');
      }

      function fillFormControls(root, fields, values) {
        fields.forEach(function(field) {
          const current = values[field.name] || '';
          if (field.type === 'checks') {
            fillCheckGroup(root, field, current);
            return;
          }
          const named = namedControls(root, field.name);
          if (named.length && named[0].type === 'radio') {
            named.forEach(function(input) { input.checked = input.value === String(current); });
            return;
          }
          let input = named[0];
          if (!input) {
            const label = document.createElement('label');
            label.className = 'field';
            label.appendChild(document.createTextNode(field.label));
            input = field.type === 'textarea' ? document.createElement('textarea') : (field.type === 'select' ? document.createElement('select') : document.createElement('input'));
            if (field.type === 'checkbox') input.type = 'checkbox';
            input.name = field.name;
            label.appendChild(input);
            root.appendChild(label);
          }
          if (input.tagName === 'SELECT') {
            input.innerHTML = '<option value="">Select…</option>' + (field.options || []).map(function(option) {
              return `<option ${option === current ? 'selected' : ''}>${escapeHtml(option)}</option>`;
            }).join('');
          } else if (input.type === 'checkbox') input.checked = current === 'Yes' || current === true;
          else if (current) input.value = current;
        });
      }

      function collectFormValues(root, fields) {
        const values = {};
        fields.forEach(function(field) {
          const named = namedControls(root, field.name);
          if (!named.length) return;
          if (field.type === 'checks') {
            values[field.name] = named.filter(function(input) { return input.checked; }).map(function(input) { return input.value; });
            return;
          }
          if (named[0].type === 'radio') {
            const picked = named.filter(function(input) { return input.checked; })[0];
            values[field.name] = picked ? picked.value : '';
            return;
          }
          const input = named[0];
          values[field.name] = input.type === 'checkbox' ? input.checked : input.value;
        });
        return values;
      }

      function runFormScript(js, api) {
        if (!js || !String(js).trim()) return;
        const runner = new Function('EEForm', 'google', 'window', 'parent', 'top', 'document', 'fetch', 'XMLHttpRequest', 'eval', 'Function', js);
        runner(api, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined);
      }

      function renderStudentHelp() {
        advanceScene();
        const main = document.getElementById('main');
        const hub = state.messageDesks.student;
        if (hub) {
          syncStudentUnread(hub);
          paintStudentHelp(hub);
          return;
        }
        main.innerHTML = loadingLine('Loading messages...');
        callServer('getTicketHub').then(function(loaded) {
          rememberMessageDesk(loaded, 'student');
          syncStudentUnread(loaded);
          if (state.section === 'help') paintStudentHelp(loaded);
        }).catch(showError);
      }

      function syncStudentUnread(hub) {
        if (!hub) return;
        hub.unreadCount = (hub.tickets || []).filter(function(ticket) { return ticket.studentUnread; }).length;
        if (state.studentHome) {
          state.studentHome.unreadTicketCount = hub.unreadCount;
          state.studentHome.unreadTickets = (hub.tickets || []).filter(function(ticket) { return ticket.studentUnread; }).map(function(ticket) {
            return { ticketId: ticket.ticketId, title: ticket.title, category: ticket.category, lastUpdated: ticket.lastUpdated };
          });
        }
        paintTabDot('help', hub.unreadCount, 'Help');
      }

      function syncStaffUnread(hub) {
        if (!hub) return;
        hub.unreadCount = (hub.tickets || []).filter(function(ticket) { return ticket.staffUnread; }).length;
        if (state.actingAs === hub.viewAs) {
          state.staffTicketUnread = hub.unreadCount;
          state.ticketBadgeFor = hub.viewAs;
          paintTabDot('tickets', hub.unreadCount, 'Messages');
        }
      }

      function paintStudentHelp(hub) {
        const main = document.getElementById('main');
        const faqs = hub.faqs || [];
        const tickets = hub.tickets || [];
        main.innerHTML = `<div class="page-head"><div><p class="eyebrow">Help</p><h1>Messages</h1><p class="lede">Search common answers, or send a message to your supervisor or the EE Coordinator.</p></div><div class="page-actions"><button type="button" class="button secondary" id="refresh-messages">Refresh</button><button type="button" class="button" id="new-ticket">New message</button></div></div>
          <section><h2>Quick answers</h2><div class="toolbar"><input id="faq-search" type="search" placeholder="Search common questions" aria-label="Search common questions"></div>
          <div class="faq-list" id="faq-list">${faqs.length ? faqs.map(renderFaq).join('') : '<div class="empty">No published answers yet.</div>'}</div></section>
          <section class="section-gap"><h2>My messages</h2><div class="ticket-list" id="ticket-list">${tickets.length ? tickets.map(function(ticket) { return renderTicket(ticket, false); }).join('') : '<div class="empty">You have not sent a message yet.</div>'}</div></section>`;
        document.getElementById('faq-search').addEventListener('input', function(event) {
          const query = event.target.value.trim().toLowerCase();
          main.querySelectorAll('[data-faq]').forEach(function(card) {
            card.classList.toggle('hidden', query && card.dataset.faq.indexOf(query) < 0);

        document.getElementById('refresh-messages').addEventListener('click', function(event) { refreshMessageDesk(event.currentTarget, false); });
        bindTicketList(main, tickets, false);
        openFocusedTicket(main);
      }

      function renderFaq(faq) {
        return `<article class="faq" data-faq="${escapeHtml((faq.question + ' ' + faq.answer).toLowerCase())}"><strong>${escapeHtml(faq.question)}</strong><p>${escapeHtml(faq.answer)}</p></article>`;
      }

      function categoryChip(name, categories) {
        const match = (categories || []).filter(function(item) { return item.name === name; })[0];
        return `<span class="chip ${match ? match.chip : ''}">${escapeHtml(name)}</span>`;
      }

      function messageLabel(message, ticket) {
        if (state.user.role === 'student') {
          if (message.authorRole === 'student') return 'You';
          return ticket.route === 'coordinator' ? 'EE Coordinator' : 'Supervisor';
        }
        if (message.authorEmail === state.user.email) return 'You';
        if (message.authorRole === 'student') return ticket.displayName || 'Student';
        return 'Staff';
      }

      function itemKindChip(ticket) {
        if (!ticket.shared) return '<span class="chip" data-kind-chip>Note</span>';
        if (ticket.category === 'Note') return '<span class="chip" data-kind-chip>Message</span>';
        return categoryChip(ticket.category, (state.ticketHub && state.ticketHub.categories) || []).replace('<span class="chip', '<span data-kind-chip class="chip');
      }

      function shareControl(ticket) {
        if (!ticket.canShare) return '';
        return `<label class="share-check"><input type="checkbox" data-share="${escapeHtml(ticket.ticketId)}" ${ticket.shared ? 'checked' : ''} aria-label="Shared"> Shared</label>`;
      }

      function messageMarkup(message, ticket) {
        const mine = state.user.role === 'student' ? message.authorRole === 'student' : message.authorEmail === state.user.email;
        return `<article class="msg ${mine ? 'mine' : 'staff'}" data-message="${escapeHtml(message.messageId)}"><strong>${escapeHtml(messageLabel(message, ticket))}</strong> <span class="muted">${escapeHtml(String(message.createdAt || '').replace('T', ' ').slice(0, 16))}</span><p>${escapeHtml(message.body)}</p></article>`;
      }

      function renderTicket(ticket, staff) {
        const unread = staff ? ticket.staffUnread : ticket.studentUnread;
        return `<details class="ticket" data-ticket="${escapeHtml(ticket.ticketId)}" data-updated="${escapeHtml(ticket.lastUpdated || '')}">
          <summary>${itemKindChip(ticket)}<strong>${escapeHtml(ticket.title)}</strong><span class="chip" data-status-chip>${escapeHtml(ticket.status)}</span><span class="muted">${escapeHtml(ticket.routeLabel || '')}</span>${staff ? `<span class="muted">${escapeHtml(ticket.displayName || '')}</span>` : ''}${shareControl(ticket)}${unread ? '<span class="dot" aria-label="Unread"></span>' : ''}</summary>
          <div class="body"><div class="thread">${(ticket.messages || []).map(function(message) { return messageMarkup(message, ticket); }).join('')}</div>
          ${staff ? `<label class="field">Status<select data-ticket-status>${['Open', 'In Progress', 'Resolved', 'Closed'].map(function(status) {
            return `<option ${ticket.status === status ? 'selected' : ''}>${status}</option>`;
          }).join('')}</select></label>` : ''}
          <label class="field">Reply<textarea data-ticket-reply maxlength="2000" placeholder="Write a reply"></textarea></label>
          <div><button type="button" class="button" data-send-ticket="${escapeHtml(ticket.ticketId)}">Send</button></div></div></details>`;
      }

      function liveTicket(ticketId) {
        const safe = String(ticketId || '').replace(/"/g, '');
        if (!safe) return null;
        return document.querySelector('details.ticket[data-ticket="' + safe + '"]');
      }

      function withCachedTickets(ticketId, visit) {
        const seen = [];
        cachedTicketCopies(ticketId).forEach(function(copy) {
          if (seen.indexOf(copy.ticket) >= 0) return;
          seen.push(copy.ticket);
          visit(copy.ticket);
        });
      }

      function refreshTicketChrome(ticket) {
        const details = liveTicket(ticket.ticketId);
        if (!details) return;
        const kind = details.querySelector('[data-kind-chip]');
        if (kind) kind.outerHTML = itemKindChip(ticket);
        const status = details.querySelector('[data-status-chip]');
        if (status) status.textContent = ticket.status || '';
        const select = details.querySelector('[data-ticket-status]');
        if (select && ticket.status) select.value = ticket.status;
        const box = details.querySelector('[data-share]');
        if (box) {
          box.checked = !!ticket.shared;
          box.disabled = String(ticket.ticketId).indexOf('pending-') === 0;
        }
        details.dataset.updated = ticket.lastUpdated || '';
      }

      function quietServer(method, args) {
        if (!window.eeCall) return Promise.reject(new Error('The EE Hub is still connecting.'));
        return window.eeCall(method, args || []).then(function(result) {
          return result;
        }, function(error) {
          throw new Error(error && error.message ? error.message : String(error));
        });
      }

      function ticketStampNewer(left, right) {
        return String(left || '').localeCompare(String(right || '')) > 0;
      }

      function sameOptimisticMessage(server, local) {
        if (!server || !local || server.body !== local.body) return false;
        if (local.authorEmail && server.authorEmail) return server.authorEmail === local.authorEmail;
        return server.authorRole === local.authorRole;
      }

      function mergeIntoTicket(local, incoming) {
        if (ticketStampNewer(local.lastUpdated, incoming.lastUpdated)) return;
        ['status', 'shared', 'kind', 'lastUpdated', 'studentUnread', 'staffUnread', 'route', 'routeLabel', 'displayName', 'title', 'category', 'canShare', 'authorEmail', 'assignee'].forEach(function(key) {
          if (incoming[key] !== undefined) local[key] = incoming[key];
        });
        const incomingMessages = incoming.messages || [];
        const pending = (local.messages || []).filter(function(message) {
          if (String(message.messageId).indexOf('pending-') !== 0) return false;
          return !incomingMessages.some(function(item) { return sameOptimisticMessage(item, message); });
        });
        local.messages = incomingMessages.concat(pending);
      }

      function mergeTicketList(localTickets, incomingTickets) {
        const byId = {};
        (localTickets || []).forEach(function(ticket) { byId[ticket.ticketId] = ticket; });
        const merged = [];
        (localTickets || []).forEach(function(ticket) {
          if (String(ticket.ticketId).indexOf('pending-') === 0) merged.push(ticket);
        });
        (incomingTickets || []).forEach(function(incoming) {
          const local = byId[incoming.ticketId];
          if (local) mergeIntoTicket(local, incoming);
          merged.push(local || incoming);
        });
        return merged;
      }

      function refreshUnreadDot(details, ticket, staff) {
        if (!details) return;
        const unread = staff ? !!ticket.staffUnread : !!ticket.studentUnread;
        const dot = details.querySelector('summary .dot');
        if (unread && !dot) {
          const summary = details.querySelector('summary');
          if (summary) summary.insertAdjacentHTML('beforeend', '<span class="dot" aria-label="Unread"></span>');
        } else if (!unread && dot) dot.remove();
      }

      function syncThread(details, ticket) {
        const thread = details.querySelector('.thread');
        if (!thread) return;
        const current = Array.prototype.map.call(thread.querySelectorAll('[data-message]'), function(node) {
          return node.dataset.message;
        }).join('\n');
        const next = (ticket.messages || []).map(function(message) { return message.messageId; }).join('\n');
        if (current === next) return;
        thread.innerHTML = (ticket.messages || []).map(function(message) {
          return messageMarkup(message, ticket);
        }).join('');
      }

      function syncTicketListDom(tickets, staff) {
        const list = document.getElementById('ticket-list');
        if (!list) return;
        const wanted = {};
        tickets.forEach(function(ticket) { wanted[ticket.ticketId] = true; });
        Array.prototype.forEach.call(list.querySelectorAll('details.ticket'), function(details) {
          if (!wanted[details.dataset.ticket]) details.remove();
        });
        const empty = list.querySelector('.empty');
        if (tickets.length && empty) empty.remove();
        tickets.forEach(function(ticket) {
          const id = String(ticket.ticketId).replace(/"/g, '');
          let details = list.querySelector('details.ticket[data-ticket="' + id + '"]');
          if (!details) {
            list.insertAdjacentHTML('beforeend', renderTicket(ticket, staff));
            details = list.querySelector('details.ticket[data-ticket="' + id + '"]');
            if (details) bindOneTicket(details, ticket, staff);
            return;
          }
          syncThread(details, ticket);
          refreshTicketChrome(ticket);
          refreshUnreadDot(details, ticket, staff);
        });
        tickets.forEach(function(ticket) {
          const id = String(ticket.ticketId).replace(/"/g, '');
          const details = list.querySelector('details.ticket[data-ticket="' + id + '"]');
          if (details) list.appendChild(details);
        });
        if (!tickets.length) {
          list.innerHTML = '<div class="empty">' + (staff ? 'No messages in this queue.' : 'You have not sent a message yet.') + '</div>';
        }
      }

      function updateMessageCount(tickets) {
        const count = document.getElementById('message-count');
        if (!count) return;
        const total = (tickets || []).length;
        count.textContent = total + ' message' + (total === 1 ? '' : 's');
      }

      function refreshMessageDesk(button, staff) {
        if (!button || button.getAttribute('aria-busy') === 'true') return;
        const scene = state.scene;
        const section = state.section;
        const actingAs = state.actingAs;
        const key = staff ? actingAs : 'student';
        markSync(button, 'pending');
        const request = staff ? quietServer('getStaffTickets', [actingAs]) : quietServer('getTicketHub', []);
        request.then(function(hub) {
          if (!sameScene(scene) || state.section !== section || (staff && state.actingAs !== actingAs)) return;
          const local = state.messageDesks[key];
          const merged = local ? mergeTicketList(local.tickets || [], hub.tickets || []) : (hub.tickets || []);
          const next = local || hub;
          next.tickets = merged;
          if (hub.faqs) next.faqs = hub.faqs;
          if (hub.categories) next.categories = hub.categories;
          if (hub.viewAs) next.viewAs = hub.viewAs;
          if (!local) rememberMessageDesk(next, key);
          if (staff) syncStaffUnread(next);
          else syncStudentUnread(next);
          syncTicketListDom(next.tickets, staff);
          updateMessageCount(next.tickets);
          if (button.isConnected) markSync(button, 'confirmed');
        }).catch(function(error) {
          if (!sameScene(scene) || !button.isConnected) return;
          markSync(button, 'rejected');
          showError(error);
        });
      }

      function noteMessagesHtml(note) {
        const messages = note.messages && note.messages.length ? note.messages : [{ messageId: '', body: note.title || '' }];
        return messages.map(function(message) {
          return `<p data-message="${escapeHtml(message.messageId)}">${escapeHtml(message.body || '')}</p>`;
        }).join('');
      }

      function syncNoteListDom(notes) {
        const list = document.querySelector('#main .note-list');
        if (!list || state.notesPane === 'templates') return;
        const wanted = {};
        notes.forEach(function(note) { wanted[note.ticketId] = true; });
        Array.prototype.forEach.call(list.querySelectorAll('.note-card[data-ticket]'), function(card) {
          if (!wanted[card.dataset.ticket]) card.remove();
        });
        const empty = list.querySelector('.empty');
        if (notes.length && empty) empty.remove();
        notes.forEach(function(note) {
          const id = String(note.ticketId).replace(/"/g, '');
          let card = list.querySelector('.note-card[data-ticket="' + id + '"]');
          if (!card) {
            list.insertAdjacentHTML('beforeend', renderNoteCard(note));
            card = list.querySelector('.note-card[data-ticket="' + id + '"]');
            if (card) bindShareList(card, [note]);
            return;
          }
          const thread = card.querySelector('.note-thread');
          if (thread) {
            const current = Array.prototype.map.call(thread.querySelectorAll('[data-message]'), function(node) {
              return node.dataset.message;
            }).join('\n');
            const nextIds = (note.messages || []).map(function(message) { return message.messageId; }).join('\n');
            if (current !== nextIds) thread.innerHTML = noteMessagesHtml(note);
          }
          card.dataset.updated = note.lastUpdated || '';
          const who = card.querySelector('[data-note-who]');
          if (who) who.textContent = note.displayName ? note.displayName + ' · ' : '';
          const kind = card.querySelector('[data-note-kind]');
          if (kind) kind.textContent = note.shared ? 'Message' : 'Note';
          const box = card.querySelector('[data-share]');
          if (box) box.checked = !!note.shared;
        });
        notes.forEach(function(note) {
          const id = String(note.ticketId).replace(/"/g, '');
          const card = list.querySelector('.note-card[data-ticket="' + id + '"]');
          if (card) list.appendChild(card);
        });
        if (!notes.length) list.innerHTML = '<div class="empty">Open a student to take a note. Notes you save appear here.</div>';
      }

      function refreshStaffNotes(button) {
        if (!button || button.getAttribute('aria-busy') === 'true') return;
        const scene = state.scene;
        const actingAs = state.actingAs;
        markSync(button, 'pending');
        quietServer('getStaffNotesHub', [actingAs]).then(function(hub) {
          if (!sameScene(scene) || state.section !== 'notes' || state.actingAs !== actingAs) return;
          const local = state.notesHub;
          const merged = mergeTicketList((local && local.notes) || [], hub.notes || []);
          const next = local || hub;
          next.notes = merged;
          next.viewAs = hub.viewAs || next.viewAs;
          if (hub.templates) next.templates = hub.templates;
          if (hub.phases) next.phases = hub.phases;
          if (hub.students) next.students = hub.students;
          state.notesHub = next;
          if (state.notesPane !== 'templates') syncNoteListDom(next.notes);
          if (button.isConnected) markSync(button, 'confirmed');
        }).catch(function(error) {
          if (!sameScene(scene) || !button.isConnected) return;
          markSync(button, 'rejected');
          showError(error);
        });
      }

      function rememberTicketRead(ticket, staff) {
        withCachedTickets(ticket.ticketId, function(copy) {
          if (staff) copy.staffUnread = false;
          else copy.studentUnread = false;
        });
        if (staff && state.staffHome && state.staffHome.unreadTickets) {
          state.staffHome.unreadTickets = state.staffHome.unreadTickets.filter(function(item) { return item.ticketId !== ticket.ticketId; });
          state.staffHome.unreadTicketCount = Math.max(0, (state.staffHome.unreadTicketCount || 0) - 1);
        }
        if (staff) syncStaffUnread(state.messageDesks[state.actingAs]);
        else syncStudentUnread(state.messageDesks.student);
      }

      function markTicketOpened(ticket, details, staff) {
        const unread = staff ? ticket.staffUnread : ticket.studentUnread;
        if (!unread || String(ticket.ticketId).indexOf('pending-') === 0) return;
        const dot = details.querySelector('summary .dot');
        if (dot) dot.remove();
        rememberTicketRead(ticket, staff);
        const viewAs = staff ? state.actingAs : '';
        enqueueTicket(ticket.ticketId, function() {
          return dispatchServer('markTicketRead', [ticket.ticketId, ticket.lastUpdated, viewAs]);
        }).then(function(result) {
          if (!result || !result.lastUpdated) return;
          withCachedTickets(ticket.ticketId, function(copy) { copy.lastUpdated = result.lastUpdated; });
          const node = liveTicket(ticket.ticketId);
          if (node) node.dataset.updated = result.lastUpdated;
        }).catch(function(error) {
          withCachedTickets(ticket.ticketId, function(copy) {
            if (staff) copy.staffUnread = true;
            else copy.studentUnread = true;
          });
          if (staff) syncStaffUnread(state.messageDesks[state.actingAs]);
          else syncStudentUnread(state.messageDesks.student);
          const node = liveTicket(ticket.ticketId);
          if (node && !node.querySelector('summary .dot')) {
            const summary = node.querySelector('summary');
            if (summary) summary.insertAdjacentHTML('beforeend', '<span class="dot" aria-label="Unread"></span>');
          }
          showError(error);
        });
      }

      function shareTargets(ticket) {
        const targets = [ticket];
        cachedTicketCopies(ticket.ticketId).forEach(function(copy) {
          if (targets.indexOf(copy.ticket) < 0) targets.push(copy.ticket);
        });
        if (state.notesHub && state.notesHub.notes) {
          state.notesHub.notes.forEach(function(note) {
            if (note.ticketId === ticket.ticketId && targets.indexOf(note) < 0) targets.push(note);
          });
        }
        return targets;
      }

      function saveTicketShare(ticket, wanted) {
        const previous = !!ticket.shared;
        shareTargets(ticket).forEach(function(copy) {
          copy.shared = !!wanted;
          copy.kind = wanted ? 'message' : 'note';
        });
        refreshTicketChrome(ticket);
        const cards = document.querySelectorAll('[data-ticket="' + String(ticket.ticketId).replace(/"/g, '') + '"]');
        cards.forEach(function(node) {
          const kind = node.querySelector('[data-note-kind]');
          if (kind) kind.textContent = wanted ? 'Message' : 'Note';
          const box = node.querySelector('[data-share]');
          if (box) box.checked = !!wanted;
          markSync(node, 'pending');
        });
        const viewAs = state.user.role === 'staff' ? state.actingAs : '';
        enqueueTicket(ticket.ticketId, function() {
          return dispatchServer('setMessageShared', [ticket.ticketId, wanted, ticket.lastUpdated, viewAs]);
        }).then(function(result) {
          shareTargets(ticket).forEach(function(copy) {
            copy.shared = !!result.shared;
            copy.kind = result.kind || (copy.shared ? 'message' : 'note');
            copy.lastUpdated = result.lastUpdated || copy.lastUpdated;
          });
          if (!result.shared) {
            ['coordinator', 'supervisor'].forEach(function(key) {
              const hub = state.messageDesks[key];
              if (!hub || !hub.tickets) return;
              hub.tickets = hub.tickets.filter(function(item) { return item.ticketId !== ticket.ticketId; });
              syncStaffUnread(hub);
            });
          }
          document.querySelectorAll('[data-ticket="' + String(ticket.ticketId).replace(/"/g, '') + '"]').forEach(function(node) {
            const kind = node.querySelector('[data-note-kind]');
            if (kind) kind.textContent = result.shared ? 'Message' : 'Note';
            if (!result.shared && node.tagName === 'DETAILS' && state.section === 'tickets') {
              markSync(node, 'confirmed');
              window.setTimeout(function() { if (node.parentElement) node.remove(); }, 700);
              return;
            }
            markSync(node, 'confirmed');
          });
          const still = cachedTicketCopies(ticket.ticketId)[0];
          if (still) refreshTicketChrome(still.ticket);
          const count = document.getElementById('message-count');
          const desk = currentMessageDesk();
          if (count && desk) count.textContent = (desk.tickets || []).length + ' message' + ((desk.tickets || []).length === 1 ? '' : 's');
        }).catch(function(error) {
          shareTargets(ticket).forEach(function(copy) {
            copy.shared = previous;
            copy.kind = previous ? 'message' : 'note';
          });
          document.querySelectorAll('[data-ticket="' + String(ticket.ticketId).replace(/"/g, '') + '"]').forEach(function(node) {
            const kind = node.querySelector('[data-note-kind]');
            if (kind) kind.textContent = previous ? 'Message' : 'Note';
            const box = node.querySelector('[data-share]');
            if (box) box.checked = previous;
            markSync(node, 'rejected');
          });
          const still = cachedTicketCopies(ticket.ticketId)[0];
          if (still) refreshTicketChrome(still.ticket);
          showError(error);
        });
      }

      function sendTicketUpdate(ticket, details, body, nextStatus, staff) {
        const previousStatus = ticket.status;
        const message = body ? {
          messageId: 'pending-' + Date.now(),
          authorRole: state.user.role === 'staff' ? 'staff' : 'student',
          authorEmail: state.user.email,
          body: body,
          createdAt: new Date().toISOString()
        } : null;
        let optimisticStatus = nextStatus || previousStatus;
        if (staff && body && (!nextStatus || nextStatus === previousStatus) && previousStatus === 'Open') optimisticStatus = 'In Progress';
        withCachedTickets(ticket.ticketId, function(copy) {
          copy.status = optimisticStatus;
          if (message) copy.messages = (copy.messages || []).concat([message]);
        });
        if (message) {
          const thread = details.querySelector('.thread');
          if (thread) thread.insertAdjacentHTML('beforeend', messageMarkup(message, ticket));
          const reply = details.querySelector('[data-ticket-reply]');
          if (reply) reply.value = '';
        }
        refreshTicketChrome(ticket);
        markSync(details, 'pending');
        const viewAs = staff ? state.actingAs : '';
        enqueueTicket(ticket.ticketId, function() {
          const token = ticket.lastUpdated;
          const started = body ? dispatchServer('replyTicket', [ticket.ticketId, body, token, viewAs]) : Promise.resolve({ lastUpdated: token, status: previousStatus });
          return started.then(function(result) {
            if (!nextStatus || nextStatus === result.status) return result;
            return dispatchServer('setTicketStatus', [ticket.ticketId, nextStatus, result.lastUpdated, viewAs]);
          });
        }).then(function(result) {
          withCachedTickets(ticket.ticketId, function(copy) {
            copy.lastUpdated = result.lastUpdated || copy.lastUpdated;
            if (result.status) copy.status = result.status;
          });
          const node = liveTicket(ticket.ticketId);
          if (!node || !node.isConnected) return;
          node.dataset.updated = result.lastUpdated || node.dataset.updated;
          refreshTicketChrome(ticket);
          markSync(node, 'confirmed');
        }).catch(function(error) {
          withCachedTickets(ticket.ticketId, function(copy) {
            copy.status = previousStatus;
            if (message) copy.messages = (copy.messages || []).filter(function(item) { return item.messageId !== message.messageId; });
          });
          const node = liveTicket(ticket.ticketId);
          if (node && node.isConnected) {
            if (message) {
              const article = node.querySelector('[data-message="' + message.messageId + '"]');
              if (article) article.remove();
              const reply = node.querySelector('[data-ticket-reply]');
              if (reply) reply.value = body;
            }
            refreshTicketChrome(ticket);
            markSync(node, 'rejected');
          }
          showError(error);
        });
      }

      function bindOneTicket(details, ticket, staff) {
        details.addEventListener('toggle', function() {
          if (!details.open) return;
          markTicketOpened(ticket, details, staff);
        });
        details.querySelectorAll('[data-share]').forEach(function(box) {
          const label = box.closest('label');
          if (label) label.addEventListener('click', function(event) { event.stopPropagation(); });
          box.addEventListener('click', function(event) { event.stopPropagation(); });
          box.addEventListener('change', function() {
            saveTicketShare(ticket, box.checked);
          });
        });
        const button = details.querySelector('[data-send-ticket]');
        if (!button) return;
        button.addEventListener('click', function() {
          const body = details.querySelector('[data-ticket-reply]').value.trim();
          const statusSelect = details.querySelector('[data-ticket-status]');
          const status = statusSelect ? statusSelect.value : ticket.status;
          const statusChanged = !!(statusSelect && status !== ticket.status);
          if (!body && !statusChanged) return;
          if (body.length > 2000) {
            showError(new Error('Replies must be 2,000 characters or fewer.'));
            return;
          }
          sendTicketUpdate(ticket, details, body, statusChanged ? status : '', staff);
        });
      }

      function bindTicketList(main, tickets, staff) {
        const byId = {};
        tickets.forEach(function(ticket) { byId[ticket.ticketId] = ticket; });
        main.querySelectorAll('details.ticket').forEach(function(details) {
          const ticket = byId[details.dataset.ticket];
          if (ticket) bindOneTicket(details, ticket, staff);
        });
      }

      function openTicketDialog(categories) {
        const dialog = document.getElementById('form-dialog');
        let selected = categories[0] || null;
        dialog.hidden = false;
        dialog.innerHTML = `<div class="form-panel" role="dialog" aria-modal="true" aria-label="New message"><div class="toolbar"><h2>New message</h2><button type="button" class="button secondary" id="close-ticket">Close</button></div>
          <p class="muted">Choose who should see this.</p>
          <div class="cats" id="ticket-cats">${categories.map(function(category, index) {
            return `<button type="button" class="${category.chip}" data-category="${escapeHtml(category.name)}" aria-pressed="${index === 0 ? 'true' : 'false'}">${escapeHtml(category.name)}</button>`;
          }).join('')}</div>
          <p class="notice" id="ticket-route">${selected ? escapeHtml(routeNote(selected.route)) : ''}</p>
          <label class="field">Subject<input id="ticket-title" maxlength="90"></label>
          <label class="field">Message<textarea id="ticket-body" maxlength="2000"></textarea></label>
          <p class="notice error" id="ticket-error" hidden></p>
          <div class="toolbar"><button type="button" class="button" id="send-ticket">Send message</button></div></div>`;
        document.getElementById('close-ticket').addEventListener('click', function() { dialog.hidden = true; dialog.innerHTML = ''; });
        dialog.querySelectorAll('[data-category]').forEach(function(button) {
          button.addEventListener('click', function() {
            selected = categories.filter(function(category) { return category.name === button.dataset.category; })[0] || selected;
            dialog.querySelectorAll('[data-category]').forEach(function(item) { item.setAttribute('aria-pressed', item === button ? 'true' : 'false'); });
            document.getElementById('ticket-route').textContent = selected ? routeNote(selected.route) : '';
          });
        });
        document.getElementById('send-ticket').addEventListener('click', function() {
          const error = document.getElementById('ticket-error');
          const title = document.getElementById('ticket-title').value.trim();
          const body = document.getElementById('ticket-body').value.trim();
          error.hidden = true;
          if (!selected) { error.hidden = false; error.textContent = 'Choose a category.'; return; }
          if (!title) { error.hidden = false; error.textContent = 'Add a short subject.'; return; }
          if (title.length > 90) { error.hidden = false; error.textContent = 'Subject must be 90 characters or fewer.'; return; }
          if (!body) { error.hidden = false; error.textContent = 'Write your message before sending.'; return; }
          if (body.length > 2000) { error.hidden = false; error.textContent = 'Messages must be 2,000 characters or fewer.'; return; }
          const hub = state.messageDesks.student || { tickets: [], categories: categories, faqs: [], unreadCount: 0 };
          if (!state.messageDesks.student) rememberMessageDesk(hub, 'student');
          const ticket = {
            ticketId: 'pending-' + Date.now(),
            title: title,
            category: selected.name,
            status: 'Open',
            route: selected.route,
            routeLabel: selected.route === 'coordinator' ? 'EE Coordinator' : 'Supervisor',
            shared: true,
            canShare: true,
            kind: 'message',
            studentUnread: false,
            staffUnread: true,
            messages: [{
              messageId: 'pending-body-' + Date.now(),
              authorRole: 'student',
              authorEmail: state.user.email,
              body: body,
              createdAt: new Date().toISOString()
            }],
            lastUpdated: ''
          };
          hub.tickets = [ticket].concat(hub.tickets || []);
          dialog.hidden = true;
          dialog.innerHTML = '';
          const list = document.getElementById('ticket-list');
          if (list) {
            const empty = list.querySelector('.empty');
            if (empty) empty.remove();
            list.insertAdjacentHTML('afterbegin', renderTicket(ticket, false));
            const details = liveTicket(ticket.ticketId);
            if (details) {
              details.open = true;
              const send = details.querySelector('[data-send-ticket]');
              if (send) send.disabled = true;
              markSync(details, 'pending');
              bindOneTicket(details, ticket, false);
            }
          }
          dispatchServer('createTicket', [{ category: selected.name, title: title, body: body }]).then(function(result) {
            const previousId = ticket.ticketId;
            ticket.ticketId = result.ticketId;
            ticket.route = result.route || ticket.route;
            ticket.routeLabel = result.routeLabel || ticket.routeLabel;
            ticket.lastUpdated = result.lastUpdated || '';
            const node = liveTicket(previousId);
            if (node) {
              node.dataset.ticket = ticket.ticketId;
              node.dataset.updated = ticket.lastUpdated;
              const box = node.querySelector('[data-share]');
              if (box) {
                box.dataset.share = ticket.ticketId;
                box.disabled = false;
              }
              const send = node.querySelector('[data-send-ticket]');
              if (send) {
                send.dataset.sendTicket = ticket.ticketId;
                send.disabled = false;
              }
              markSync(node, 'confirmed');
            }
          }).catch(function(failure) {
            hub.tickets = (hub.tickets || []).filter(function(item) { return item !== ticket; });
            const node = liveTicket(ticket.ticketId);
            if (node) node.remove();
            if (!hub.tickets.length) {
              const host = document.getElementById('ticket-list');
              if (host && !host.querySelector('.ticket')) host.innerHTML = '<div class="empty">You have not sent a message yet.</div>';
            }
            showError(failure);
          });
        });
      }

      function routeNote(route) {
        return route === 'coordinator' ? 'This message goes to the EE Coordinator.' : 'This message goes to your supervisor.';
      }

      function renderStaffTickets() {
        advanceScene();
        const main = document.getElementById('main');
        const hub = state.messageDesks[state.actingAs];
        if (hub) {
          syncStaffUnread(hub);
          paintStaffTickets(hub);
          return;
        }
        if (state.actingAs !== 'supervisor' && state.actingAs !== 'coordinator') {
          paintStaffTickets({ viewAs: state.actingAs, tickets: [], unreadCount: 0, categories: [] });
          return;
        }
        const requested = state.actingAs;
        main.innerHTML = loadingLine('Loading messages...');
        callServer('getStaffTickets', requested).then(function(loaded) {
          rememberMessageDesk(loaded, requested);
          syncStaffUnread(loaded);
          if (state.section === 'tickets' && state.actingAs === requested) paintStaffTickets(loaded);
        }).catch(showError);
      }

      function paintStaffTickets(hub) {
        const main = document.getElementById('main');
        const roles = [];
        if (state.user.permissions.canAdmin) roles.push(['coordinator', 'Coordinator']);
        if (state.user.permissions.isSupervisor) roles.push(['supervisor', 'Supervisor']);
        roles.push(['staff', 'Staff browse']);
        const tickets = hub.tickets || [];
        main.innerHTML = `<div class="page-head"><div><p class="eyebrow">Help</p><h1>Messages</h1><p class="lede">${hub.viewAs === 'supervisor' ? 'Messages from your advisees.' : 'Messages routed to the EE Coordinator, plus supervisor messages that have no assignee yet.'}</p></div><div class="page-actions"><button type="button" class="button secondary" id="refresh-messages">Refresh</button></div></div>
          <div class="toolbar"><label for="ticket-acting-as">Acting as</label><select id="ticket-acting-as">${roles.map(function(role) {
            return `<option value="${role[0]}" ${state.actingAs === role[0] ? 'selected' : ''}>${role[1]}</option>`;
          }).join('')}</select><span class="muted" id="message-count">${tickets.length} message${tickets.length === 1 ? '' : 's'}</span></div>
          <div class="ticket-list" id="ticket-list">${tickets.length ? tickets.map(function(ticket) { return renderTicket(ticket, true); }).join('') : '<div class="empty">No messages in this queue.</div>'}</div>`;
        document.getElementById('refresh-messages').addEventListener('click', function(event) { refreshMessageDesk(event.currentTarget, true); });
        document.getElementById('ticket-acting-as').addEventListener('change', function(event) {
          state.actingAs = event.target.value;
          state.staffHome = null;
          state.staffStudent = null;
          state.ticketBadgeFor = '';
          renderShell();
        });
        bindTicketList(main, tickets, true);
        openFocusedTicket(main);
      }

      function openFocusedTicket(main) {
        if (!state.focusTicket || !main) return;
        const id = state.focusTicket;
        state.focusTicket = '';
        const details = main.querySelector('details[data-ticket="' + id.replace(/"/g, '') + '"]');
        if (details) details.open = true;
      }

      function setNotesOpen(open) {
        state.notesOpen = !!open;
        document.body.classList.toggle('notes-open', state.notesOpen);
        const panel = document.getElementById('notes-panel');
        if (panel) panel.classList.toggle('open', state.notesOpen);
        const toggle = document.getElementById('notes-toggle');
        const peek = document.getElementById('notes-peek');
        if (toggle) toggle.setAttribute('aria-expanded', state.notesOpen ? 'true' : 'false');
        if (peek) peek.setAttribute('aria-expanded', state.notesOpen ? 'true' : 'false');
        const drawer = document.getElementById('notes-drawer');
        if (drawer) {
          drawer.setAttribute('aria-hidden', state.notesOpen ? 'false' : 'true');
          if (state.notesOpen) drawer.removeAttribute('inert');
          else drawer.setAttribute('inert', '');
        }
      }

      function mountNotesPanel() {
        const body = document.getElementById('notes-body');
        const home = state.staffStudentHome;
        if (!body || !home) return;
        body.innerHTML = loadingLine('Loading notes...');
        callServer('getStaffStudentPanel', home.email, home.cohort || state.cohortId, state.actingAs).then(function(panel) {
          const target = document.getElementById('notes-body');
          if (!target) return;
          paintStudentNotes(target, panel, home);
        }).catch(function(error) {
          if (isStale(error)) return;
          const target = document.getElementById('notes-body');
          if (target) target.innerHTML = '<p class="notice error">' + escapeHtml(error && error.message ? error.message : error) + '</p>';
        });

      function noteBody(note) {
        const message = (note.messages || [])[0];
        return message && message.body ? message.body : (note.title || '');
      }

      function phaseLabel(phaseId, phases) {
        if (!phaseId) return 'Current phase';
        const match = (phases || []).filter(function(phase) { return phase.phaseId === phaseId; })[0];
        return match ? (match.phaseTitle || phaseId) : phaseId;
      }

      function currentStudentPhaseId() {
        const home = state.staffStudentHome;
        if (!home) return '';
        const next = nextIncomplete(home);
        return next && next.template ? next.template.phase : '';
      }

      function paintStudentNotes(target, panel, home) {
        const notes = panel.notes || [];
        const templates = panel.templates || [];
        const canWrite = !!panel.canWrite;
        target.innerHTML = `${canWrite ? '<div class="add-todo" id="student-note-composer"><button type="button" class="add-todo-open" aria-expanded="false">+ Add note</button><form class="add-todo-form"><input maxlength="2000" placeholder="Note" aria-label="New note"><button class="button" type="submit">Save</button></form></div>' : ''}
          <div class="note-list">${notes.length ? notes.map(renderNoteCard).join('') : '<div class="empty">No notes for this student yet.</div>'}</div>
          <h2>Template tasks</h2>
          <div class="note-list">${templates.length ? templates.map(function(template) {
            return `<article class="note-card"><div class="template-row"><div><strong>${escapeHtml(template.title)}</strong><p class="muted">${escapeHtml(template.description || phaseLabel(template.phaseId, panel.phases))}</p></div>${canWrite ? `<button type="button" class="button" data-apply-template="${escapeHtml(template.templateId)}">Add</button>` : ''}</div></article>`;
          }).join('') : '<div class="empty">Save template tasks from the Notes tab.</div>'}</div>`;
        bindNoteComposer(target.querySelector('#student-note-composer'), function(text) {
          return callServer('createStaffNote', home.email, home.cohort || state.cohortId, text, state.actingAs).then(function() {
            showSuccess('Note saved.');
            mountNotesPanel();
          });
        });
        bindShareList(target, notes, function() { mountNotesPanel(); });
        target.querySelectorAll('[data-apply-template]').forEach(function(button) {
          button.addEventListener('click', function() {
            button.disabled = true;
            const template = templates.filter(function(item) { return item.templateId === button.dataset.applyTemplate; })[0];
            const phaseId = (template && template.phaseId) || currentStudentPhaseId();
            callServer('applyTodoTemplate', button.dataset.applyTemplate, home.email, home.cohort || state.cohortId, phaseId, state.actingAs).then(function() {
              return callServer('getStaffStudentHome', home.email, home.cohort || state.cohortId, state.actingAs);
            }).then(function(fresh) {
              state.staffStudentHome = fresh;
              paintStudentJourney(fresh);
              if (state.section === 'students') paintStaffAsStudent(fresh);
              showSuccess('Template task added to the journey.');
              mountNotesPanel();
            }).catch(function(error) {
              button.disabled = false;
              showError(error);
            });
          });
        });
      }

      function renderNoteCard(note) {
        const who = note.displayName ? escapeHtml(note.displayName) + ' · ' : '';
        return `<article class="note-card" data-ticket="${escapeHtml(note.ticketId)}" data-updated="${escapeHtml(note.lastUpdated || '')}"><div class="note-thread">${noteMessagesHtml(note)}</div><div class="template-row"><span class="muted"><span data-note-who>${who}</span><span data-note-kind>${note.shared ? 'Message' : 'Note'}</span></span>${shareControl(note)}</div></article>`;

      function bindNoteComposer(box, onSave) {
        if (!box) return;
        const open = box.querySelector('.add-todo-open');
        const form = box.querySelector('.add-todo-form');
        const input = form.querySelector('input');
        open.addEventListener('click', function() {
          box.classList.add('is-open');
          open.setAttribute('aria-expanded', 'true');
          input.focus();
        });
        form.addEventListener('submit', function(event) {
          event.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          const submit = form.querySelector('button');

          onSave(text, box).catch(function(error) {
            submit.disabled = false;

          });

      function bindShareList(root, notes, after) {
        const byId = {};
        (notes || []).forEach(function(note) { byId[note.ticketId] = note; });
        root.querySelectorAll('[data-share]').forEach(function(box) {
          const label = box.closest('label');
          if (label) label.addEventListener('click', function(event) { event.stopPropagation(); });

      function renderStaffNotes() {
        advanceScene();
        const main = document.getElementById('main');
        main.innerHTML = loadingLine('Loading notes...');
        callServer('getStaffNotesHub', state.actingAs).then(function(hub) {
          state.notesHub = hub;

      function paintStaffNotes(hub) {
        const main = document.getElementById('main');
        const pane = state.notesPane === 'templates' ? 'templates' : 'notes';

        const templates = hub.templates || [];
        const phases = hub.phases || [];
        const students = hub.students || [];
        main.innerHTML = `<div class="page-head"><div><p class="eyebrow">Supervisor</p><h1>Notes</h1><p class="lede">Private notes stay with you. Shared notes become messages the student can see.</p></div><div class="page-actions"><button type="button" class="button secondary" id="refresh-notes">Refresh</button></div></div>
          <nav class="subnav" aria-label="Notes sections">

            <button type="button" data-notes-pane="templates" aria-current="${pane === 'templates' ? 'page' : 'false'}">Template Tasks</button>

        main.querySelectorAll('[data-notes-pane]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.notesPane = button.dataset.notesPane;
            paintStaffNotes(state.notesHub || hub);
          });

        if (pane === 'notes') {
          bindStaffNoteComposer(main, students);
          bindShareList(main, notes, function() { renderStaffNotes(); });

      function noteListEmpty(hub, students) {
        if (students.length) return 'Notes you save appear here.';
        if (hub.viewAs === 'supervisor') return 'No students are assigned to you yet.';
        return 'Open a student to take a note. Notes you save appear here.';
      }

      function renderNoteComposer(students) {
        if (!students.length) return '';
        const cohorts = {};
        students.forEach(function(student) { cohorts[student.cohortId] = true; });
        const manyCohorts = Object.keys(cohorts).length > 1;
        const options = students.map(function(student) {
          const label = student.displayName + (student.subject ? ' · ' + student.subject : '') + (manyCohorts ? ' · ' + student.cohortId : '');

      function bindStaffNoteComposer(main, students) {
        const box = main.querySelector('#note-composer');
        if (!box) return;
        const open = box.querySelector('.add-todo-open');
        const form = box.querySelector('form');
        const select = form.querySelector('select');
        const textArea = form.querySelector('textarea');
        open.addEventListener('click', function() {
          box.classList.add('is-open');
          open.setAttribute('aria-expanded', 'true');
          select.focus();
        });
        form.addEventListener('submit', function(event) {
          event.preventDefault();
          const email = select.value;
          const option = select.options[select.selectedIndex];
          const cohortId = option ? option.getAttribute('data-cohort') || '' : '';
          const text = textArea.value.trim();
          if (!email || !cohortId) {
            showError(new Error('Choose a student.'));
            return;
          }
          if (!text) return;
          if (text.length > 2000) {
            showError(new Error('Notes must be 2,000 characters or fewer.'));
            return;
          }
          const student = students.filter(function(item) { return item.email === email && item.cohortId === cohortId; })[0];
          if (!student) return;
          const submit = form.querySelector('button');
          const list = main.querySelector('.note-list');
          if (!list) return;
          submit.disabled = true;
          const note = {
            ticketId: 'pending-' + Date.now(),
            title: text.replace(/\s+/g, ' ').slice(0, 90),
            displayName: student.displayName,
            shared: false,
            canShare: true,
            kind: 'note',
            studentUnread: false,
            staffUnread: false,
            messages: [{
              messageId: 'pending-body-' + Date.now(),
              authorRole: 'staff',
              authorEmail: state.user.email,
              body: text,
              createdAt: new Date().toISOString()
            }],
            lastUpdated: ''
          };
          const hub = state.notesHub;
          if (hub) hub.notes = [note].concat(hub.notes || []);
          const empty = list.querySelector('.empty');
          if (empty) empty.remove();
          list.insertAdjacentHTML('afterbegin', renderNoteCard(note));
          const card = list.querySelector('.note-card');
          const share = card ? card.querySelector('[data-share]') : null;
          if (share) share.disabled = true;
          if (card) markSync(card, 'pending');
          textArea.value = '';
          select.value = '';
          box.classList.remove('is-open');
          open.setAttribute('aria-expanded', 'false');
          const scene = state.scene;
          const actingAs = state.actingAs;
          dispatchServer('createStaffNote', [student.email, student.cohortId, text, actingAs]).then(function(result) {
            note.ticketId = result.ticketId;
            note.lastUpdated = result.lastUpdated || '';
            submit.disabled = false;
            if (!sameScene(scene) || state.section !== 'notes' || !card || !card.isConnected) return;
            card.dataset.ticket = note.ticketId;
            card.dataset.updated = note.lastUpdated;
            if (share) {
              share.dataset.share = note.ticketId;
              share.disabled = false;
            }
            bindShareList(card, [note]);
            markSync(card, 'confirmed');
          }).catch(function(error) {
            if (hub && hub.notes) hub.notes = hub.notes.filter(function(item) { return item !== note; });
            if (card && card.isConnected) card.remove();
            if (list.isConnected && !list.querySelector('.note-card')) list.innerHTML = '<div class="empty">Notes you save appear here.</div>';
            submit.disabled = false;
            if (!textArea.value) textArea.value = text;
            if (!select.value) select.value = email;
            box.classList.add('is-open');
            open.setAttribute('aria-expanded', 'true');
            showError(error);
          });
        });
      }

      function renderResourceBody(body, format) {
        const text = String(body || '');

        if (kind === 'html') return `<div class="resource-body html">${sanitizeResourceHtml(text)}</div>`;

        return `<div class="resource-body plain">${escapeHtml(text)}</div>`;

      function sanitizeResourceHtml(value) {
        const template = document.createElement('template');
        template.innerHTML = String(value || '');
        template.content.querySelectorAll('script, iframe, object, embed, link, meta').forEach(function(node) { node.remove(); });
        template.content.querySelectorAll('*').forEach(function(node) {
          Array.from(node.attributes).forEach(function(attr) {
            const name = attr.name.toLowerCase();
            if (name.indexOf('on') === 0 || ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value))) node.removeAttribute(attr.name);
          });
        });
        return template.innerHTML;
      }

      function markdownBlock(line) {
        if (/^(#{1,3})\s+\S/.test(line)) return 'heading';
        if (/^[-*]\s+\S/.test(line)) return 'ul';
        if (/^\d+\.\s+\S/.test(line)) return 'ol';
        return '';
      }

      function renderMarkdown(source) {
        const lines = String(source || '').replace(/\r\n/g, '\n').split('\n');
        const blocks = [];
        let index = 0;
        while (index < lines.length) {
          const line = lines[index];
          if (!String(line || '').trim()) { index++; continue; }
          const kind = markdownBlock(line);
          if (kind === 'heading') {
            const heading = /^(#{1,3})\s+(\S.*)$/.exec(line);
            blocks.push(`<h${heading[1].length}>${renderMarkdownInline(heading[2])}</h${heading[1].length}>`);
            index++;
            continue;
          }
          if (kind === 'ul' || kind === 'ol') {
            const items = [];
            while (index < lines.length && markdownBlock(lines[index]) === kind) {
              items.push(`<li>${renderMarkdownInline(lines[index].replace(kind === 'ul' ? /^[-*]\s+/ : /^\d+\.\s+/, ''))}</li>`);
              index++;
            }
            blocks.push(kind === 'ul' ? `<ul>${items.join('')}</ul>` : `<ol>${items.join('')}</ol>`);
            continue;
          }
          const paragraph = [];
          while (index < lines.length && String(lines[index] || '').trim() && !markdownBlock(lines[index])) {
            paragraph.push(renderMarkdownInline(lines[index]));
            index++;
          }
          if (!paragraph.length) { index++; continue; }
          blocks.push(`<p>${paragraph.join('<br>')}</p>`);
        }
        return blocks.join('');
      }

      function renderMarkdownInline(raw) {
        const text = String(raw || '');
        const parts = [];
        const code = /`([^`\n]+)`/g;
        let last = 0;
        let match;
        while ((match = code.exec(text))) {
          parts.push(renderMarkdownEmphasis(text.slice(last, match.index)));
          parts.push(`<code>${escapeHtml(match[1])}</code>`);
          last = match.index + match[0].length;
        }
        parts.push(renderMarkdownEmphasis(text.slice(last)));
        return parts.join('');
      }

      function renderMarkdownEmphasis(raw) {
        const text = String(raw || '');
        let html = '';
        let index = 0;
        while (index < text.length) {
          if (text.slice(index, index + 2) === '**') {
            const end = text.indexOf('**', index + 2);
            if (end > index + 2) {
              html += '<strong>' + escapeHtml(text.slice(index + 2, end)) + '</strong>';
              index = end + 2;
              continue;
            }
          }
          if (text.charAt(index) === '*') {
            const end = text.indexOf('*', index + 1);
            if (end > index + 1) {
              html += '<em>' + escapeHtml(text.slice(index + 1, end)) + '</em>';
              index = end + 1;
              continue;
            }
          }
          const link = /^\[([^\]\n]+)\]\((https:\/\/[^\s)]+)\)/.exec(text.slice(index));
          if (link) {
            const safe = safeUrl(link[2]);
            html += safe
              ? '<a href="' + escapeHtml(safe) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(link[1]) + '</a>'
              : escapeHtml(link[0]);
            index += link[0].length;
            continue;
          }
          const next = text.slice(index).search(/[*[]/);
          if (next < 0) {
            html += escapeHtml(text.slice(index));
            break;
          }
          if (next === 0) {
            html += escapeHtml(text.charAt(index));
            index += 1;
            continue;
          }
          html += escapeHtml(text.slice(index, index + next));
          index += next;
        }
        return html;
      }
