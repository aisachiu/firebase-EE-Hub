<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --ink: #004C80;
        --muted: #536273;
        --paper: #FFFFFF;
        --surface: #ffffff;
        --line: #E9ECEF;
        --green: #20C997;
        --green-soft: #E8F8F3;
        --coral: #88002B;
        --gold: #FF5A36;
        --shadow: 0 4px 14px rgba(0, 76, 128, .08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: #263746; font: 14px/1.4 Helvetica, "Heiti TC", Arial, sans-serif; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px clamp(12px, 2.5vw, 32px); background: var(--ink); color: white; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
      .brand-mark { width: 22px; height: 22px; display: grid; place-items: center; color: var(--ink); background: white; font: 700 11px Helvetica, Arial, sans-serif; }
      .account { color: #e8f0f5; text-align: right; font-size: 11px; line-height: 1.25; }
      .request-indicator { display: inline-flex; align-items: center; gap: 6px; min-height: 16px; color: #e8f0f5; font-size: 10px; opacity: 0; transition: opacity .18s ease; }
      .request-indicator.active { opacity: 1; }
      .request-indicator::before { width: 8px; height: 8px; border: 2px solid rgba(232, 240, 245, .35); border-top-color: var(--green); border-radius: 50%; content: ''; animation: request-spin .8s linear infinite; }
      @keyframes request-spin { to { transform: rotate(360deg); } }
      .shell { max-width: 1440px; margin: 0 auto; padding: 10px clamp(12px, 2.5vw, 32px) 32px; }
      .nav { display: flex; align-items: center; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
      .nav button, .subnav button { border: 0; border-radius: 3px; padding: 6px 10px; color: var(--muted); background: transparent; font-size: 13px; }
      .nav button[aria-current="page"], .subnav button[aria-current="page"] { color: var(--green); background: var(--green-soft); font-weight: 700; }
      main { padding-top: 14px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 4px; font: 600 28px/1.15 Helvetica, "Heiti TC", Arial, sans-serif; letter-spacing: 0; }
      h2 { font-size: 18px; line-height: 1.2; }
      h3 { font-size: 15px; margin-bottom: 3px; }
      .eyebrow { color: var(--coral); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .lede, .muted { color: var(--muted); }
      .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
      .page-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .list { display: grid; gap: 7px; max-width: 860px; }
      .list-row, .resource-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .list-row button { color: inherit; text-align: left; border: 0; background: none; padding: 0; }
      .list-row strong { display: block; font-size: 16px; }
      .list-row small { color: var(--muted); }
      .resource-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
      .resource { min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); }
      .resource p { white-space: pre-wrap; color: var(--muted); }
      .resource a { color: var(--green); font-weight: 700; overflow-wrap: anywhere; }
      .resource-body { margin: 8px 0; color: #263746; }
      .resource-body.plain { white-space: pre-wrap; color: var(--muted); }
      .resource-body h1, .resource-body h2, .resource-body h3 { margin: 0 0 6px; color: var(--ink); font-size: 16px; line-height: 1.3; }
      .resource-body p { margin: 0 0 8px; }
      .resource-body ul, .resource-body ol { margin: 0 0 8px; padding-left: 1.2em; }
      .resource-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .resource-editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      .resource-editor-fields textarea[data-field="Body"] { min-height: 280px; }
      .resource-preview { position: sticky; top: 8px; min-width: 0; }
      .subnav { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 14px; }
      .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
      .toolbar select, .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 7px 9px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 3px; }
      .toolbar select { width: auto; min-width: 170px; }
      .button { min-height: 32px; padding: 6px 10px; border: 1px solid var(--gold); border-radius: 3px; color: white; background: var(--gold); font-weight: 700; }
      .button.secondary { border-color: var(--ink); color: var(--ink); background: white; }
      .button.danger { border-color: var(--coral); color: white; background: var(--coral); }
      .button:disabled { opacity: .55; cursor: wait; }
      .table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { max-width: 300px; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      th { position: sticky; top: 0; color: var(--muted); background: var(--line); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
      tr:last-child td { border-bottom: 0; }
      .actions { display: flex; gap: 8px; white-space: nowrap; }
      .link-button { border: 0; padding: 4px; color: var(--green); background: transparent; font-weight: 700; }
      .link-button:disabled { color: #84918c; cursor: not-allowed; }
      .editor { margin-top: 14px; padding: 14px; background: #f8fafb; border-top: 3px solid var(--green); }
      .drive-panel { margin-bottom: 14px; }
      .drive-results { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
      .drive-results li { padding: 8px 10px; background: white; border: 1px solid var(--line); }
      .drive-results a { color: var(--green); font-weight: 700; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .field { min-width: 0; display: grid; gap: 5px; }
      .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
      .field.wide { grid-column: 1 / -1; }
      .field textarea { min-height: 76px; resize: vertical; }
      .field.check { align-content: start; }
      .field.check input { width: 18px; height: 18px; accent-color: var(--green); }
      .form-intro { margin: 0 0 12px; }
      .hint { display: block; margin: 0 0 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
      .subject-picks, .likert { margin: 0 0 14px; padding: 12px; border: 1px solid var(--line); }
      .subject-picks legend, .likert legend { padding: 0 4px; font-weight: 700; }
      .check-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; }
      .check-option { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; background: #f8fafb; border: 1px solid var(--line); font-size: 14px; }
      .check-option input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--green); }
      .check-option:has(input:disabled) { color: var(--muted); background: #f3f5f6; }
      .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
      .scale label { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; text-align: center; background: #f8fafb; border: 1px solid var(--line); font-size: 12px; cursor: pointer; }
      .scale label:has(input:checked) { background: var(--green-soft); border-color: var(--green); }
      .scale input { accent-color: var(--green); }
      .scale span { font-weight: 700; }
      .scale small { color: var(--muted); line-height: 1.2; }
      .notice { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--gold); background: #fff5f1; color: #663020; }
      .notice-list { margin: 0 0 14px; }
      .notice-list h2 { margin-bottom: 8px; font-size: 16px; }
      .notice-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-width: 720px; }
      .notice-list button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; padding: 8px 10px; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--gold); background: #fff5f1; color: inherit; }
      .staff-panes { display: flex; gap: 4px; }
      .staff-panes button { border: 1px solid var(--line); background: white; color: var(--ink); padding: 6px 10px; font-weight: 700; }
      .staff-panes button[aria-current="page"] { color: white; background: var(--ink); border-color: var(--ink); }
      .error { border-left-color: var(--coral); background: #fff0ec; color: #7c2b1b; }
      .empty { padding: 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); }
      .status { min-height: 24px; color: var(--coral); }
      .back { margin-bottom: 22px; }
      .student-greeting { padding: 16px 18px; background: var(--surface); border-top: 3px solid var(--gold); box-shadow: var(--shadow); }
      .student-greeting h1 { max-width: 840px; }
      .journey-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
      .journey-controls { padding: 12px; background: #f8fafb; border-top: 3px solid var(--green); }
      .journey-controls.collapsed { display: none; }
      .quick-todo { display: flex; gap: 5px; margin: 8px 0 14px; }
      .quick-todo input { min-width: 0; width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 3px; }
      .filter-group { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
      .filter-group label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .filter-group input { accent-color: var(--green); }
      .timeline { display: grid; gap: 8px; min-width: 0; }
      .task-card { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--green); }
      .task-card.system-task { border-left-color: var(--coral); }
      .task-card.student-task { border-left-color: var(--gold); }
      .task-card.completed { opacity: .72; }
      .task-card[draggable="true"] { cursor: grab; }
      .task-card.dragging { opacity: .4; }
      .task-card input[type="checkbox"] { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--green); }
      .task-card h3 { margin: 0 0 5px; }
      .task-card p { margin: 0; color: var(--muted); white-space: pre-wrap; }
      .task-card select, .task-card input[type="date"] { padding: 4px 6px; border: 1px solid var(--line); color: var(--ink); background: white; font-size: 12px; }
      .task-meta { display: grid; justify-items: end; gap: 7px; color: var(--muted); font-size: 12px; }
      .task-kind { color: var(--coral); font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .task-card.student-task .task-kind { color: var(--gold); }
      .todo-editor { display: grid; gap: 7px; margin-top: 9px; }
      .todo-editor input, .todo-editor textarea { width: 100%; padding: 6px; border: 1px solid var(--line); }
      .timeline-toolbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
      .timeline-toolbar select { padding: 6px 8px; border: 1px solid var(--line); background: white; }
      .journey { display: grid; gap: 12px; }
      .journey-head { display: flex; justify-content: space-between; gap: 8px 12px; align-items: end; flex-wrap: wrap; }
      .journey-head h1 { margin-bottom: 0; }
      .journey-score { margin: 0; text-align: right; color: var(--muted); }
      .journey-score strong { display: block; color: var(--ink); font-size: 22px; line-height: 1; }
      .journey-bar { height: 6px; border-radius: 999px; background: #e7eef3; overflow: hidden; }
      .journey-bar span { display: block; height: 100%; background: var(--green); }
      .journey-path { display: flex; gap: 0; margin: 0; padding: 4px 0 0; list-style: none; overflow-x: auto; position: relative; }
      .journey-path > li { flex: 1 1 0; min-width: 0; }
      .journey-path::before { content: ''; position: absolute; left: 12%; right: 12%; top: 16px; height: 2px; background: #d5e0e8; }
      .phase-stop { position: relative; z-index: 1; display: grid; justify-items: center; gap: 3px; width: 100%; border: 0; padding: 0 6px 4px; background: transparent; color: var(--muted); }
      .phase-mark { width: 16px; height: 16px; border: 2px solid #c5d3de; border-radius: 50%; background: white; }
      .phase-stop.done { color: #0d7a5f; }
      .phase-stop.done .phase-mark { border-color: var(--green); background: var(--green); }
      .phase-stop.here { color: var(--ink); font-weight: 700; }
      .phase-stop.here .phase-mark { border-color: var(--ink); background: var(--ink); box-shadow: 0 0 0 4px rgba(0, 76, 128, .16); }
      .phase-stop[aria-pressed="true"] .phase-name { color: var(--gold); }
      .phase-name { font-size: 12px; line-height: 1.15; }
      .phase-count { font-size: 11px; }
      .journey-filters { display: flex; flex-wrap: wrap; gap: 6px; }
      .journey-filters button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: white; color: var(--muted); font-weight: 700; }
      .journey-filters button[aria-pressed="true"] { border-color: var(--ink); color: white; background: var(--ink); }
      .here-card { padding: 14px 16px; color: white; background: var(--ink); border-left: 5px solid var(--gold); }
      .here-card h2, .here-card p { color: white; }
      .here-card .muted, .here-card .eyebrow { color: #d5e4ef; }
      .journey-phase { background: white; border: 1px solid var(--line); }
      .journey-phase.here { border-top: 3px solid var(--gold); }
      .journey-phase header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 10px 12px 0; }
      .journey-phase h2 { margin: 0; font-size: 18px; }
      .steps-rail { list-style: none; margin: 0; padding: 8px 12px 12px; }
      .journey .step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 0; text-align: left; font-size: 14px; font-weight: 400; color: inherit; }
      .journey .step + .step { border-top: 1px solid var(--line); }
      .rail-check { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--green); }
      .rail-check:disabled { cursor: not-allowed; opacity: .55; }
      .here-card .rail-check { margin-top: 0; }
      .here-card .step-top { justify-content: flex-start; align-items: center; }
      .here-card .step-top h2 { margin: 0; }
      .journey .step.sync-pending,
      .here-card.sync-pending,
      .form-panel.sync-pending { outline: 2px solid var(--coral); outline-offset: 2px; }
      .journey .step.sync-confirmed,
      .here-card.sync-confirmed,
      .form-panel.sync-confirmed { animation: plan-saved-outline .85s ease both; }
      .journey .step.done h3 { color: var(--muted); font-weight: 600; }
      .step-top { display: flex; justify-content: space-between; gap: 6px 10px; align-items: baseline; flex-wrap: wrap; }
      .step-top h3 { margin: 0; font-size: 15px; }
      .journey .step p { margin: 3px 0 0; }
      .journey-panel { position: fixed; top: 0; right: 0; z-index: 25; height: 100vh; width: 36px; overflow: hidden; background: var(--ink); transition: width .2s ease; }
      .journey-panel.open { width: clamp(300px, 34vw, 420px); background: #f6f8f9; border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 30, 50, .12); }
      .journey-peek { position: absolute; top: 40px; right: auto; bottom: 0; left: 0; width: 36px; border: 0; color: white; background: transparent; writing-mode: vertical-rl; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .journey-panel.open .journey-peek { display: none; }
      .journey-panel:not(.open) .journey-drawer { visibility: hidden; }
      .journey-drawer { width: clamp(300px, 34vw, 420px); height: 100%; display: flex; flex-direction: column; background: #f6f8f9; }
      .journey-panel-bar { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 10px; color: white; background: var(--ink); flex: none; }
      .journey-panel-bar button { border: 0; color: white; background: transparent; font-weight: 700; }
      .journey-scroll { flex: 1; overflow: auto; padding: 10px; }
      .journey-panel h1 { font-size: 20px; }
      .journey-panel .here-card h2 { font-size: 16px; }
      .journey-panel .journey-filters button { padding: 4px 8px; font-size: 12px; }
      .journey-toggle { border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 3px 10px; color: white; background: transparent; font-weight: 700; }
      .journey-toggle[aria-expanded="true"] { color: var(--ink); background: white; }
      body.has-journey { padding-right: 36px; transition: padding-right .2s ease; }
      body.has-journey.journey-open { padding-right: clamp(300px, 34vw, 420px); }
      .step-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
      .add-todo { padding: 2px 2px 8px; }
      .add-todo-open { border: 0; padding: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
      .add-todo-open:hover, .add-todo-open:focus { color: var(--ink); }
      .add-todo-form { display: none; gap: 6px; margin-top: 6px; }
      .add-todo.is-open .add-todo-form { display: flex; }
      .add-todo.is-open .add-todo-open { display: none; }
      .add-todo-form input, .add-todo-form select, .add-todo-form textarea { min-width: 0; flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px; background: white; }
      .add-todo-form textarea { width: 100%; min-height: 72px; }
      .load-stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 10vw; }
      .notes-scroll .load-stage, .journey-scroll .load-stage { min-height: 220px; padding: 28px 18px; }
      .notes-scroll .load-quote, .journey-scroll .load-quote { max-width: 12em; }
      .notes-scroll .load-quote-text, .journey-scroll .load-quote-text { font-size: 26px; }
      .load-status { margin: 0 0 22px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .load-quote { margin: 0; border: 0; padding: 0; color: #1a4d73; }
      .load-quote-text { font: 500 clamp(14px, 4.8vw, 28px)/1.22 Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif; background-image: linear-gradient(305deg, #16324a 0%, #1d4e73 34%, #0f6f62 66%, #16324a 100%); background-size: 240% 100%; animation: quote-sheen 11s ease-in-out infinite; }
      @supports ((-webkit-background-clip: text) or (background-clip: text)) {
        .load-quote-text { color: transparent; -webkit-background-clip: text; background-clip: text; }
      }
      @keyframes quote-sheen { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
      @media (prefers-reduced-motion: reduce) {
        .load-quote-text { animation: none; background-position: 42% 50%; }
      }
      .staff-board { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 14px; align-items: start; }
      .staff-board.solo { grid-template-columns: minmax(0, 1fr); }
      .next-steps { position: sticky; top: 52px; padding: 12px; background: white; border: 1px solid var(--line); border-top: 3px solid var(--ink); }
      .next-steps ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
      .next-steps button { display: grid; gap: 2px; width: 100%; padding: 8px 10px; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--green); background: #f8fafb; color: inherit; }
      .next-steps button:hover, .next-steps button:focus { border-color: var(--ink); }
      .next-steps strong { color: var(--ink); }
      .next-steps span { color: var(--muted); font-size: 12px; }
      .note-list { display: grid; gap: 8px; }
      .note-card { display: grid; gap: 4px; padding: 10px 12px; background: white; border: 1px solid var(--line); border-left: 3px solid var(--ink); }
      .note-card p, .note-thread p { margin: 0; white-space: pre-wrap; }
      .note-thread { display: grid; gap: 6px; }
      .note-thread p + p { padding-top: 6px; border-top: 1px solid var(--line); }
      .share-check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
      .share-check input { width: 16px; height: 16px; accent-color: var(--green); }
      .notes-panel { position: fixed; top: 0; left: 0; z-index: 24; height: 100vh; width: 36px; overflow: hidden; background: var(--ink); transition: width .2s ease; }
      .notes-panel.open { width: clamp(300px, 32vw, 400px); background: #f6f8f9; border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(0, 30, 50, .12); }
      .notes-peek { position: absolute; top: 40px; bottom: 0; left: 0; width: 36px; border: 0; color: white; background: transparent; writing-mode: vertical-rl; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .notes-panel.open .notes-peek { display: none; }
      .notes-panel:not(.open) .notes-drawer { visibility: hidden; }
      .notes-drawer { width: clamp(300px, 32vw, 400px); height: 100%; display: flex; flex-direction: column; background: #f6f8f9; }
      .notes-scroll { flex: 1; overflow: auto; padding: 10px; display: grid; align-content: start; gap: 8px; }
      body.has-notes { padding-left: 36px; transition: padding-left .2s ease; }
      body.has-notes.notes-open { padding-left: clamp(300px, 32vw, 400px); }
      .add-todo-form.stack { flex-direction: column; align-items: stretch; }
      .template-row { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
